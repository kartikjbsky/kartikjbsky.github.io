name: Update gallery manifest

on:
  push:
    paths:
      - 'img/gallery/**'
      - 'tools/generate_gallery.py'
      - '.github/workflows/update-gallery.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate gallery.json
        run: python3 tools/generate_gallery.py

      - name: Commit manifest if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery.json
          if git diff --cached --quiet; then
            echo "gallery.json is already up to date."
          else
            git commit -m "Update gallery manifest"
            git push
          fi
